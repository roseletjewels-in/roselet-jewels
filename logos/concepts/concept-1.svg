<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED8A1"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C7730"/>
    </linearGradient>
    <linearGradient id="navyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
  </defs>

  <!-- Background Base Disc -->
  <circle cx="256" cy="256" r="248" fill="url(#navyGrad1)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad1)" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5"/>

  <!-- Main Icon & Monogram -->
  <g id="icon">
    <!-- Inner Aura Ring -->
    <circle cx="256" cy="180" r="102" fill="#0C1B33" stroke="url(#goldGrad1)" stroke-width="2"/>
    <circle cx="256" cy="180" r="94" fill="none" stroke="url(#goldGrad1)" stroke-width="0.8" opacity="0.6"/>

    <!-- Stylized Rosebud Petals forming Monogram Core -->
    <!-- Center Rosebud core -->
    <path d="M 256 120 C 275 140 285 165 272 185 C 262 198 245 198 238 185 C 228 165 238 140 256 120 Z" 
          fill="url(#goldGrad1)" opacity="0.9"/>
    
    <!-- Left Blooming Petal (also forms loop of R) -->
    <path d="M 248 135 C 220 145 205 170 215 195 C 224 218 250 218 260 205 C 248 200 236 185 238 165 C 240 150 248 140 248 135 Z" 
          fill="url(#goldGrad1)"/>
          
    <!-- Right Blooming Petal -->
    <path d="M 264 135 C 292 145 307 170 297 195 C 288 218 262 218 252 205 C 264 200 276 185 274 165 C 272 150 264 140 264 135 Z" 
          fill="url(#goldGrad1)" opacity="0.85"/>

    <!-- Stem & Pedestal Monogram Legs -->
    <path d="M 235 180 L 235 240 C 235 244 231 247 225 247 L 220 247 L 220 252 L 250 252 L 250 247 L 245 247 C 240 247 238 244 238 240 L 238 205" 
          fill="none" stroke="url(#goldGrad1)" stroke-width="4.5" stroke-linecap="round"/>
          
    <path d="M 256 195 C 262 208 270 226 285 246 C 288 249 292 250 298 251 L 298 252 L 270 252 C 260 238 253 222 248 208" 
          fill="url(#goldGrad1)"/>

    <!-- Central Sparkling Diamond Starlet -->
    <path d="M 256 94 L 260 106 L 272 110 L 260 114 L 256 126 L 252 114 L 240 110 L 252 106 Z" 
          fill="#FFFFFF"/>
    <circle cx="256" cy="110" r="1.5" fill="url(#goldGrad1)"/>
    
    <!-- Accent Dots -->
    <circle cx="178" cy="180" r="3" fill="url(#goldGrad1)"/>
    <circle cx="334" cy="180" r="3" fill="url(#goldGrad1)"/>
  </g>

  <!-- Wordmark Section -->
  <g id="wordmark">
    <!-- Horizontal Divider Wings -->
    <line x1="90" y1="305" x2="160" y2="305" stroke="url(#goldGrad1)" stroke-width="1.2"/>
    <polygon points="163,305 160,303 160,307" fill="url(#goldGrad1)"/>
    <circle cx="175" cy="305" r="2.5" fill="url(#goldGrad1)"/>

    <circle cx="337" cy="305" r="2.5" fill="url(#goldGrad1)"/>
    <polygon points="349,305 352,303 352,307" fill="url(#goldGrad1)"/>
    <line x1="352" y1="305" x2="422" y2="305" stroke="url(#goldGrad1)" stroke-width="1.2"/>

    <!-- Brand Name: ROSELET -->
    <text x="256" y="348" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" 
          font-size="40" 
          font-weight="700" 
          letter-spacing="9" 
          fill="#FFFFFF">ROSELET</text>

    <!-- Sub-Brand: JEWELS with Sparkle -->
    <text x="256" y="392" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Century Gothic', 'Helvetica Neue', sans-serif" 
          font-size="16" 
          font-weight="500" 
          letter-spacing="14" 
          fill="url(#goldGrad1)">JEWELS</text>
  </g>

  <!-- Tagline Section -->
  <g id="tagline">
    <text x="256" y="440" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="9" 
          font-weight="400" 
          letter-spacing="5" 
          fill="#A4B3C6">ANTI-TARNISH &bull; DAILY LUXE</text>
  </g>
</svg>
