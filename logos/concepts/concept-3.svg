<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DC"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <radialGradient id="discGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#142A4D"/>
      <stop offset="100%" stop-color="#081426"/>
    </radialGradient>
  </defs>

  <!-- Dark Midnight Blue Background -->
  <rect width="512" height="512" rx="32" fill="url(#discGlow)"/>

  <!-- Icon: 4-Way Interlocked 'R' Rosette Crest -->
  <g id="icon">
    <!-- Concentric Halo Ring -->
    <circle cx="256" cy="180" r="110" fill="none" stroke="url(#gold3)" stroke-width="1.5" stroke-dasharray="3,6"/>
    <circle cx="256" cy="180" r="102" fill="#0C1B33" stroke="url(#gold3)" stroke-width="2"/>

    <!-- 4 Intertwined 'R' Monograms (Created via clean 4-fold rotational symmetry) -->
    <g transform="translate(256, 180)">
      <!-- North R -->
      <g>
        <path d="M -12 -58 L -12 -12 M -12 -58 C 14 -58 14 -32 -12 -32 M -4 -32 L 14 -12" 
              fill="none" stroke="url(#gold3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-12" cy="-58" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- East R (90 deg) -->
      <g transform="rotate(90)">
        <path d="M -12 -58 L -12 -12 M -12 -58 C 14 -58 14 -32 -12 -32 M -4 -32 L 14 -12" 
              fill="none" stroke="url(#gold3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-12" cy="-58" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- South R (180 deg) -->
      <g transform="rotate(180)">
        <path d="M -12 -58 L -12 -12 M -12 -58 C 14 -58 14 -32 -12 -32 M -4 -32 L 14 -12" 
              fill="none" stroke="url(#gold3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-12" cy="-58" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- West R (270 deg) -->
      <g transform="rotate(270)">
        <path d="M -12 -58 L -12 -12 M -12 -58 C 14 -58 14 -32 -12 -32 M -4 -32 L 14 -12" 
              fill="none" stroke="url(#gold3)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-12" cy="-58" r="2.5" fill="#FFFFFF"/>
      </g>

      <!-- Center Rosette Core Petals / Sparkle Diamond -->
      <circle cx="0" cy="0" r="16" fill="#0A1931" stroke="url(#gold3)" stroke-width="2"/>
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2" fill="url(#gold3)"/>
    </g>

    <!-- 4 Cardinal Accents -->
    <circle cx="256" cy="62" r="3" fill="url(#gold3)"/>
    <circle cx="256" cy="298" r="3" fill="url(#gold3)"/>
    <circle cx="138" cy="180" r="3" fill="url(#gold3)"/>
    <circle cx="374" cy="180" r="3" fill="url(#gold3)"/>
  </g>

  <!-- Wordmark Section -->
  <g id="wordmark">
    <!-- Starlet Diamond Sparkle Inside O-axis -->
    <text x="256" y="364" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
          font-size="42" 
          font-weight="700" 
          letter-spacing="9" 
          fill="#FFFFFF">ROSELET</text>

    <!-- Sub-Brand JEWELS with Gold Flourish -->
    <g transform="translate(256, 396)">
      <line x1="-120" y1="0" x2="-60" y2="0" stroke="url(#gold3)" stroke-width="1.2"/>
      <polygon points="-60,0 -64,-2.5 -64,2.5" fill="url(#gold3)"/>
      <circle cx="-52" cy="0" r="2" fill="url(#gold3)"/>

      <text x="0" y="5" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
            font-size="16" 
            font-weight="600" 
            letter-spacing="14" 
            fill="url(#gold3)">JEWELS</text>

      <circle cx="52" cy="0" r="2" fill="url(#gold3)"/>
      <polygon points="60,0 64,-2.5 64,2.5" fill="url(#gold3)"/>
      <line x1="60" y1="0" x2="120" y2="0" stroke="url(#gold3)" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Tagline Section -->
  <g id="tagline">
    <text x="256" y="448" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="10" 
          font-weight="400" 
          letter-spacing="6" 
          fill="#94A3B8">WATERPROOF &bull; ANTI-TARNISH</text>
  </g>
</svg>
