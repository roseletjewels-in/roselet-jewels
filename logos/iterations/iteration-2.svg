<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="40%" stop-color="#E5C77A"/>
      <stop offset="70%" stop-color="#CFA349"/>
      <stop offset="100%" stop-color="#9E7623"/>
    </linearGradient>
    <radialGradient id="emeraldBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0F4235"/>
      <stop offset="60%" stop-color="#082820"/>
      <stop offset="100%" stop-color="#031410"/>
    </radialGradient>
  </defs>

  <!-- Imperial Emerald Green Background -->
  <rect width="512" height="512" rx="28" fill="url(#emeraldBg)"/>

  <!-- Icon: Heritage Emerald Crest & Rosette -->
  <g id="icon">
    <!-- Outer Shield / Cushion Facet Border -->
    <path d="M 256 68 C 325 68 360 105 360 180 C 360 255 325 292 256 292 C 187 292 152 255 152 180 C 152 105 187 68 256 68 Z" 
          fill="#06221B" stroke="url(#champagneGold)" stroke-width="2"/>
    <path d="M 256 78 C 317 78 348 111 348 180 C 348 249 317 282 256 282 C 195 282 164 249 164 180 C 164 111 195 78 256 78 Z" 
          fill="none" stroke="url(#champagneGold)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6"/>

    <!-- Central Symmetrical Roselet Rosette -->
    <g transform="translate(256, 180)">
      <!-- 4 Ornamental Leaf Petals -->
      <path d="M 0 -72 C 18 -45 18 -15 0 0 C -18 -15 -18 -45 0 -72 Z" fill="url(#champagneGold)" opacity="0.85"/>
      <path d="M 72 0 C 45 18 15 18 0 0 C 15 -18 45 -18 72 0 Z" fill="url(#champagneGold)" opacity="0.85"/>
      <path d="M 0 72 C -18 45 -18 15 0 0 C 18 15 18 45 0 72 Z" fill="url(#champagneGold)" opacity="0.85"/>
      <path d="M -72 0 C -45 -18 -15 -18 0 0 C -15 18 -45 18 -72 0 Z" fill="url(#champagneGold)" opacity="0.85"/>

      <!-- Diagonal Filigree Petals -->
      <circle cx="32" cy="-32" r="6" fill="none" stroke="url(#champagneGold)" stroke-width="1.8"/>
      <circle cx="-32" cy="-32" r="6" fill="none" stroke="url(#champagneGold)" stroke-width="1.8"/>
      <circle cx="32" cy="32" r="6" fill="none" stroke="url(#champagneGold)" stroke-width="1.8"/>
      <circle cx="-32" cy="32" r="6" fill="none" stroke="url(#champagneGold)" stroke-width="1.8"/>

      <!-- Central Brilliant Diamond -->
      <polygon points="0,-16 5,-5 16,0 5,5 0,16 -5,5 -16,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.5" fill="#CFA349"/>
    </g>

    <!-- Regal Crown Sparkle -->
    <polygon points="256,54 259,62 267,64 259,66 256,74 253,66 245,64 253,62" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark Section -->
  <g id="wordmark">
    <!-- Brand Name: ROSELET -->
    <text x="256" y="364" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', Georgia, serif" 
          font-size="42" 
          font-weight="700" 
          letter-spacing="10" 
          fill="#FFFFFF">ROSELET</text>

    <!-- Sub-Brand: JEWELS with Gold Flourish -->
    <g transform="translate(256, 396)">
      <line x1="-120" y1="0" x2="-60" y2="0" stroke="url(#champagneGold)" stroke-width="1.2"/>
      <circle cx="-52" cy="0" r="2" fill="url(#champagneGold)"/>

      <text x="0" y="5" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
            font-size="16" 
            font-weight="500" 
            letter-spacing="14" 
            fill="url(#champagneGold)">JEWELS</text>

      <circle cx="52" cy="0" r="2" fill="url(#champagneGold)"/>
      <line x1="60" y1="0" x2="120" y2="0" stroke="url(#champagneGold)" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Tagline Section -->
  <g id="tagline">
    <text x="256" y="445" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="9.5" 
          font-weight="400" 
          letter-spacing="6" 
          fill="#86A89E">ROYAL DEMI-FINE ORNAMENTS</text>
  </g>
</svg>
