<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="roseGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAE6"/>
      <stop offset="35%" stop-color="#EAA698"/>
      <stop offset="70%" stop-color="#D48A7A"/>
      <stop offset="100%" stop-color="#A85949"/>
    </linearGradient>
    <linearGradient id="onyxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1D21"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>
  </defs>

  <!-- Deep Onyx Noir Canvas -->
  <rect width="512" height="512" rx="28" fill="url(#onyxBg)"/>

  <!-- Icon: Precision Rose Gold Monogram Emblem -->
  <g id="icon">
    <!-- Slender Circular Bezel -->
    <circle cx="256" cy="180" r="105" fill="none" stroke="url(#roseGold1)" stroke-width="2"/>
    <circle cx="256" cy="180" r="97" fill="#141519" stroke="url(#roseGold1)" stroke-width="0.8" opacity="0.6"/>

    <!-- Stylized Modern 'R' intertwined with Blooming Petals -->
    <!-- R Stem with diamond serif base -->
    <path d="M 226 130 L 226 230 M 216 230 L 236 230 M 216 130 L 236 130" 
          stroke="url(#roseGold1)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Blooming Rose Petal forming the Loop of 'R' -->
    <path d="M 226 130 C 265 125 288 142 284 170 C 280 196 255 204 226 204" 
          fill="none" stroke="url(#roseGold1)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Internal Rosebud Petal Heart -->
    <path d="M 242 145 C 260 148 270 160 266 174 C 262 186 248 190 236 186 C 248 180 254 170 252 160 C 250 152 244 148 242 145 Z" 
          fill="url(#roseGold1)" opacity="0.85"/>

    <!-- Dynamic Leg of 'R' with graceful botanical flare -->
    <path d="M 248 200 C 256 208 268 222 284 230 M 280 230 L 292 230" 
          stroke="url(#roseGold1)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Solitaire Sparkle Diamond Accent at Top Right of Bezel -->
    <g transform="translate(330, 106)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2" fill="url(#roseGold1)"/>
    </g>

    <!-- Subtle Cardinal Diamond Pins -->
    <circle cx="256" cy="75" r="2.5" fill="url(#roseGold1)"/>
    <circle cx="256" cy="285" r="2.5" fill="url(#roseGold1)"/>
    <circle cx="151" cy="180" r="2.5" fill="url(#roseGold1)"/>
  </g>

  <!-- Wordmark Section -->
  <g id="wordmark">
    <!-- Starlet Sparkle -->
    <path d="M 256 312 L 258 319 L 265 321 L 258 323 L 256 330 L 254 323 L 247 321 L 254 319 Z" fill="#FCEAE6"/>

    <!-- Brand Name: ROSELET -->
    <text x="256" y="370" 
          text-anchor="middle" 
          font-family="'Playfair Display', 'Bodoni MT', 'Didot', 'Georgia', serif" 
          font-size="44" 
          font-weight="600" 
          letter-spacing="9" 
          fill="#FFFFFF">ROSELET</text>

    <!-- Gold Accent Rule -->
    <g transform="translate(256, 396)">
      <line x1="-110" y1="0" x2="-55" y2="0" stroke="url(#roseGold1)" stroke-width="1.2"/>
      <polygon points="-55,0 -59,-2.5 -59,2.5" fill="url(#roseGold1)"/>
      
      <text x="0" y="5" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Century Gothic', 'Helvetica Neue', sans-serif" 
            font-size="16" 
            font-weight="500" 
            letter-spacing="14" 
            fill="url(#roseGold1)">JEWELS</text>
            
      <polygon points="55,0 59,-2.5 59,2.5" fill="url(#roseGold1)"/>
      <line x1="55" y1="0" x2="110" y2="0" stroke="url(#roseGold1)" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Tagline Section -->
  <g id="tagline">
    <text x="256" y="445" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="9.5" 
          font-weight="400" 
          letter-spacing="6" 
          fill="#A3A3A8">ANTI-TARNISH &bull; DAILY LUXE</text>
  </g>
</svg>
