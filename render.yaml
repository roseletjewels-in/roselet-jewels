services:
  - type: web
    name: roselet-jewels-omni
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ADMIN_PASSWORD
        value: roseletadmin2026
      - key: BUSINESS_WHATSAPP
        value: 919847012345
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
